name: companywatch-m2

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-companywatch-m2}-backend:m2
  build:
    context: ./backend
  environment: &database-environment
    MYSQL_HOST: db
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: ${MYSQL_DATABASE:-companywatch}
    MYSQL_USER: ${MYSQL_USER:-companywatch}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Export MYSQL_PASSWORD before running Compose}

services:
  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-companywatch}
      MYSQL_USER: ${MYSQL_USER:-companywatch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Export MYSQL_PASSWORD before running Compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Export MYSQL_ROOT_PASSWORD before running Compose}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 30

  migrate:
    <<: *backend
    environment:
      <<: *database-environment
      M2_MIGRATION_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      COMPANYWATCH_M2_MIGRATE: ${COMPANYWATCH_M2_MIGRATE:-0}
    command:
      - sh
      - -ec
      - |
        case "$$M2_MIGRATION_PROJECT" in
          ""|companywatch)
            echo "M2 migration requires a separate Compose project"
            exit 2
            ;;
        esac
        if [ "$$COMPANYWATCH_M2_MIGRATE" != 1 ]; then
          echo "Set COMPANYWATCH_M2_MIGRATE=1 to migrate this M2 project"
          exit 2
        fi
        exec alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15).close()"]
      interval: 5s
      timeout: 16s
      start_period: 10s
      retries: 12

  tests:
    <<: *backend
    profiles: ["tools"]
    environment:
      <<: *database-environment
      ETL_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    command: ["pytest", "-q"]
    volumes:
      - ./scripts:/checks:ro

  etl:
    <<: *backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "app.etl.cli"]
    command: ["--help"]
    tmpfs:
      - /etl-private:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=1073741824

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-companywatch-m2}-frontend:m1
    build:
      context: ./frontend
    profiles: ["tools"]

volumes:
  mysql_data:
