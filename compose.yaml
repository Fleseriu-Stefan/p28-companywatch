name: companywatch

x-backend: &backend
  image: companywatch-backend:m1
  build:
    context: ./backend
  environment: &database-environment
    MYSQL_HOST: db
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: ${MYSQL_DATABASE:-companywatch}
    MYSQL_USER: ${MYSQL_USER:-companywatch}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Export MYSQL_PASSWORD before running Compose}

services:
  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-companywatch}
      MYSQL_USER: ${MYSQL_USER:-companywatch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Export MYSQL_PASSWORD before running Compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Export MYSQL_ROOT_PASSWORD before running Compose}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15).close()"]
      interval: 5s
      timeout: 16s
      start_period: 10s
      retries: 12

  tests:
    <<: *backend
    profiles: ["tools"]
    command: ["pytest", "-q"]
    volumes:
      - ./scripts:/checks:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: companywatch-frontend:m1
    build:
      context: ./frontend
    profiles: ["tools"]

volumes:
  mysql_data:
