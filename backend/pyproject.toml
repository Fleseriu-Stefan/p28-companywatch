[project]
name = "companywatch-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the isolated MySQL database created by scripts/verify.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
